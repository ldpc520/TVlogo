<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑装机配置清单</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2c6fd1 0%, #1e4db5 100%);
            color: white;
            padding: 25px 30px;
            border-bottom: 4px solid #1a3f8c;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        h1 i {
            margin-right: 12px;
            font-size: 32px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #f9fafc;
            border-bottom: 1px solid #eaeef5;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .primary-btn {
            background-color: #2c6fd1;
            color: white;
        }
        
        .primary-btn:hover {
            background-color: #1e5ab8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(44, 111, 209, 0.3);
        }
        
        .secondary-btn {
            background-color: #f0f4ff;
            color: #2c6fd1;
            border: 1px solid #d0ddf5;
        }
        
        .secondary-btn:hover {
            background-color: #e1e9ff;
        }
        
        .danger-btn {
            background-color: #ff4757;
            color: white;
        }
        
        .danger-btn:hover {
            background-color: #ff3742;
        }
        
        .success-btn {
            background-color: #2ed573;
            color: white;
        }
        
        .success-btn:hover {
            background-color: #25c464;
        }
        
        .stats {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 16px;
        }
        
        .total-price {
            font-weight: 600;
            color: #2c6fd1;
            font-size: 20px;
        }
        
        .table-container {
            padding: 20px 30px 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        thead {
            background-color: #f1f5fd;
        }
        
        /* 网页表头行高固定为50px */
        th {
            padding: 0 15px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #e1e8f0;
            font-size: 16px;
            height: 50px; /* 网页表头行高固定为50px */
            vertical-align: middle;
        }
        
        /* 网页表格内容行高固定为40px */
        td {
            padding: 0 15px;
            border-bottom: 1px solid #eef2f7;
            height: 40px; /* 网页表格内容行高固定为40px */
            vertical-align: middle;
        }
        
        tbody tr:hover {
            background-color: #f9fbfe;
        }
        
        .part-type {
            font-weight: 500;
            color: #2c3e50;
        }
        
        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 4px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #2c6fd1;
            box-shadow: 0 0 0 2px rgba(44, 111, 209, 0.1);
        }
        
        .price-input {
            text-align: right;
        }
        
        .serial {
            width: 60px;
            text-align: center;
            font-weight: 500;
            color: #5a6c7d;
        }
        
        .part-type-col {
            width: 180px;
        }
        
        .model-col {
            min-width: 300px;
        }
        
        .price-col {
            width: 150px;
        }
        
        .actions-col {
            width: 100px;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: #5a6c7d;
            padding: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .action-btn:hover {
            color: #2c6fd1;
        }
        
        .total-row {
            background-color: #f8fafd;
            font-weight: 600;
        }
        
        .total-row td {
            padding: 0 15px;
            font-size: 16px;
            height: 50px; /* 总计行也使用较高行高 */
        }
        
        .footer {
            padding: 20px 30px;
            background-color: #f9fafc;
            border-top: 1px solid #eaeef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #5a6c7d;
        }
        
        .export-note {
            font-size: 14px;
            color: #7b8a9b;
        }
        
        .export-note i {
            color: #2c6fd1;
            margin-right: 5px;
        }
        
        .error {
            border-color: #ff4757 !important;
        }
        
        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .container {
                border-radius: 8px;
            }
            
            header, .controls, .table-container, .footer {
                padding: 15px;
            }
            
            .controls {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .button-group {
                width: 100%;
                justify-content: space-between;
            }
            
            .stats {
                width: 100%;
                justify-content: space-between;
            }
            
            th, td {
                padding: 0 8px;
            }
            
            /* 移动端保持相同的行高设置 */
            th {
                height: 50px; /* 移动端表头行高 */
            }
            
            td {
                height: 40px; /* 移动端表格内容行高 */
            }
            
            .serial {
                width: 40px;
            }
            
            .part-type-col {
                width: 120px;
            }
            
            .model-col {
                min-width: 200px;
            }
        }
        
        .empty-row {
            text-align: center;
            color: #7b8a9b;
            height: 40px; /* 空行也使用相同的行高 */
        }
        
        .delete-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .delete-btn:hover {
            background-color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-desktop"></i> 电脑装机配置清单</h1>
            <p class="subtitle">填写您的电脑配件信息，系统将自动计算总价并支持导出到Word文档</p>
        </header>
        
        <div class="controls">
            <div class="button-group">
                <button class="primary-btn" id="addRowBtn">
                    <i class="fas fa-plus"></i> 添加配件
                </button>
                <button class="secondary-btn" id="resetBtn">
                    <i class="fas fa-redo"></i> 重置
                </button>
                <button class="success-btn" id="exportBtn">
                    <i class="fas fa-file-word"></i> 导出到Word
                </button>
            </div>
            
            <div class="stats">
                <div>已配置项目: <span id="configuredCount">0</span>/<span id="totalCount">14</span></div>
                <div>总计: <span class="total-price" id="totalPrice">0</span> 元</div>
            </div>
        </div>
        
        <div class="table-container">
            <table id="configTable">
                <thead>
                    <tr>
                        <th class="serial">序号</th>
                        <th class="part-type-col">配件类型</th>
                        <th class="model-col">型号</th>
                        <th class="price-col">单价(元)</th>
                        <th class="actions-col">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 表格行将通过JavaScript动态生成 -->
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="3" style="text-align: right;">合计</td>
                        <td id="totalCell">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
        
        <div class="footer">
            <div class="export-note">
                <i class="fas fa-info-circle"></i> 提示：只有型号和单价都有输入内容的行才会被导出到Word文档
            </div>
            <div>© 2026 电脑装机配置工具</div>
        </div>
    </div>

    <script>
        // 初始配置数据
        const initialConfig = [
            { id: 1, type: "CPU", model: "", price: "" },
            { id: 2, type: "CPU散热器", model: "", price: "" },
            { id: 3, type: "主板", model: "", price: "" },
            { id: 4, type: "内存", model: "", price: "" },
            { id: 5, type: "硬盘(主)", model: "", price: "" },
            { id: 6, type: "硬盘(副)", model: "", price: "" },
            { id: 7, type: "显卡", model: "", price: "" },
            { id: 8, type: "电源", model: "", price: "" },
            { id: 9, type: "机箱", model: "", price: "" },
            { id: 10, type: "机箱风扇", model: "", price: "" },
            { id: 11, type: "键盘", model: "", price: "" },
            { id: 12, type: "鼠标", model: "", price: "" },
            { id: 13, type: "显示器", model: "", price: "" },
            { id: 14, type: "音响", model: "", price: "" }
        ];

        // 当前配置数据
        let configData = JSON.parse(JSON.stringify(initialConfig));
        let nextId = 15; // 用于新增行的ID

        // DOM元素
        const tableBody = document.getElementById('tableBody');
        const totalPriceElement = document.getElementById('totalPrice');
        const totalCell = document.getElementById('totalCell');
        const configuredCountElement = document.getElementById('configuredCount');
        const totalCountElement = document.getElementById('totalCount');
        const addRowBtn = document.getElementById('addRowBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');

        // 初始化表格
        function initTable() {
            tableBody.innerHTML = '';
            totalCountElement.textContent = configData.length;
            
            configData.forEach(item => {
                addRowToTable(item);
            });
            
            updateStats();
        }

        // 添加行到表格
        function addRowToTable(item) {
            const row = document.createElement('tr');
            row.id = `row-${item.id}`;
            
            // 创建序号单元格
            const serialCell = document.createElement('td');
            serialCell.className = 'serial';
            serialCell.textContent = item.id;
            
            // 创建配件类型单元格
            const typeCell = document.createElement('td');
            typeCell.className = 'part-type';
            typeCell.textContent = item.type;
            
            // 创建型号输入单元格
            const modelCell = document.createElement('td');
            const modelInput = document.createElement('input');
            modelInput.type = 'text';
            modelInput.className = 'model-input';
            modelInput.value = item.model;
            modelInput.placeholder = '请输入型号';
            modelInput.dataset.id = item.id;
            modelCell.appendChild(modelInput);
            
            // 创建单价输入单元格
            const priceCell = document.createElement('td');
            const priceInput = document.createElement('input');
            priceInput.type = 'text';
            priceInput.className = 'price-input';
            priceInput.value = item.price;
            priceInput.placeholder = '0';
            priceInput.dataset.id = item.id;
            priceCell.appendChild(priceInput);
            
            // 添加错误消息元素
            const errorElement = document.createElement('div');
            errorElement.className = 'error-message';
            errorElement.id = `error-${item.id}`;
            priceCell.appendChild(errorElement);
            
            // 创建操作单元格 - 所有行都有删除按钮
            const actionsCell = document.createElement('td');
            actionsCell.className = 'actions-col';
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i> 删除';
            deleteBtn.title = '删除此行';
            deleteBtn.onclick = () => deleteRow(item.id);
            actionsCell.appendChild(deleteBtn);
            
            // 组装行
            row.appendChild(serialCell);
            row.appendChild(typeCell);
            row.appendChild(modelCell);
            row.appendChild(priceCell);
            row.appendChild(actionsCell);
            
            // 添加到表格
            tableBody.appendChild(row);
            
            // 添加事件监听
            modelInput.addEventListener('input', handleModelInput);
            priceInput.addEventListener('input', handlePriceInput);
            priceInput.addEventListener('blur', validatePrice);
        }

        // 处理型号输入
        function handleModelInput(e) {
            const id = parseInt(e.target.dataset.id);
            const item = configData.find(item => item.id === id);
            if (item) {
                item.model = e.target.value.trim();
                updateStats();
            }
        }

        // 处理单价输入
        function handlePriceInput(e) {
            const id = parseInt(e.target.dataset.id);
            const item = configData.find(item => item.id === id);
            if (item) {
                // 只允许输入数字
                const value = e.target.value.replace(/[^\d]/g, '');
                e.target.value = value;
                item.price = value;
                
                // 清除错误状态
                e.target.classList.remove('error');
                const errorElement = document.getElementById(`error-${id}`);
                errorElement.style.display = 'none';
                
                updateTotal();
                updateStats();
            }
        }

        // 验证单价
        function validatePrice(e) {
            const id = parseInt(e.target.dataset.id);
            const value = e.target.value;
            const errorElement = document.getElementById(`error-${id}`);
            
            if (value && !/^\d+$/.test(value)) {
                e.target.classList.add('error');
                errorElement.textContent = '请输入整数';
                errorElement.style.display = 'block';
                return false;
            } else if (value && parseInt(value) < 0) {
                e.target.classList.add('error');
                errorElement.textContent = '单价不能为负数';
                errorElement.style.display = 'block';
                return false;
            } else {
                e.target.classList.remove('error');
                errorElement.style.display = 'none';
                return true;
            }
        }

        // 更新总计
        function updateTotal() {
            let total = 0;
            configData.forEach(item => {
                if (item.price && !isNaN(parseInt(item.price))) {
                    total += parseInt(item.price);
                }
            });
            
            totalPriceElement.textContent = total.toLocaleString();
            totalCell.textContent = total.toLocaleString() + ' 元';
        }

        // 更新统计信息
        function updateStats() {
            const configured = configData.filter(item => item.model && item.price).length;
            configuredCountElement.textContent = configured;
            updateTotal();
        }

        // 添加新行
        function addNewRow() {
            const newItem = {
                id: nextId++,
                type: "其他配件",
                model: "",
                price: ""
            };
            
            configData.push(newItem);
            addRowToTable(newItem);
            updateStats();
            
            // 滚动到新行
            const newRow = document.getElementById(`row-${newItem.id}`);
            newRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            // 聚焦到型号输入
            const modelInput = newRow.querySelector('.model-input');
            modelInput.focus();
        }

        // 删除行
        function deleteRow(id) {
            if (configData.length <= 1) {
                alert('至少需要保留一行配置');
                return;
            }
            
            if (confirm('确定要删除这一行配置吗？')) {
                configData = configData.filter(item => item.id !== id);
                const row = document.getElementById(`row-${id}`);
                if (row) row.remove();
                updateStats();
            }
        }

        // 重置表格
        function resetTable() {
            if (confirm('确定要重置所有数据吗？此操作不可撤销。')) {
                configData = JSON.parse(JSON.stringify(initialConfig));
                nextId = 15;
                initTable();
            }
        }

        // ================= 导出到Word（生成标准 .docx，A4 纸张） =================

        // CRC32 查找表（ZIP 校验用）
        const crc32Table = (() => {
            const table = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) {
                    c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                }
                table[n] = c;
            }
            return table;
        })();

        // CRC32 校验值
        function crc32(bytes) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc = crc32Table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        // 极简 ZIP 打包器（store 存储模式，无需第三方库，生成合法的 .docx 容器）
        function createZip(files) {
            const encoder = new TextEncoder();
            const now = new Date();
            const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
            const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

            const locals = [];
            const centrals = [];
            let offset = 0;

            files.forEach(file => {
                const nameBytes = encoder.encode(file.name);
                const data = file.data;
                const crc = crc32(data);

                // 本地文件头（30 字节 + 文件名 + 数据）
                const local = new Uint8Array(30 + nameBytes.length + data.length);
                const lv = new DataView(local.buffer);
                lv.setUint32(0, 0x04034b50, true);   // 签名 PK\x03\x04
                lv.setUint16(4, 20, true);           // 解压所需版本
                lv.setUint16(6, 0x0800, true);       // 标志位：UTF-8 文件名
                lv.setUint16(8, 0, true);            // 压缩方式：0 = 存储不压缩
                lv.setUint16(10, dosTime, true);
                lv.setUint16(12, dosDate, true);
                lv.setUint32(14, crc, true);         // CRC32 校验值
                lv.setUint32(18, data.length, true); // 压缩后大小
                lv.setUint32(22, data.length, true); // 原始大小
                lv.setUint16(26, nameBytes.length, true);
                lv.setUint16(28, 0, true);           // 扩展字段长度
                local.set(nameBytes, 30);
                local.set(data, 30 + nameBytes.length);
                locals.push(local);

                // 中央目录记录（46 字节 + 文件名）
                const central = new Uint8Array(46 + nameBytes.length);
                const cv = new DataView(central.buffer);
                cv.setUint32(0, 0x02014b50, true);
                cv.setUint16(4, 20, true);           // 制作版本
                cv.setUint16(6, 20, true);           // 解压所需版本
                cv.setUint16(8, 0x0800, true);
                cv.setUint16(10, 0, true);
                cv.setUint16(12, dosTime, true);
                cv.setUint16(14, dosDate, true);
                cv.setUint32(16, crc, true);
                cv.setUint32(20, data.length, true);
                cv.setUint32(24, data.length, true);
                cv.setUint16(28, nameBytes.length, true);
                cv.setUint16(30, 0, true);
                cv.setUint16(32, 0, true);
                cv.setUint16(34, 0, true);           // 起始磁盘号
                cv.setUint16(36, 0, true);           // 内部属性
                cv.setUint32(38, 0, true);           // 外部属性
                cv.setUint32(42, offset, true);      // 本地文件头偏移量
                central.set(nameBytes, 46);
                centrals.push(central);

                offset += local.length;
            });

            let centralSize = 0;
            centrals.forEach(c => { centralSize += c.length; });

            // 中央目录结束记录（22 字节）
            const eocd = new Uint8Array(22);
            const ev = new DataView(eocd.buffer);
            ev.setUint32(0, 0x06054b50, true);
            ev.setUint16(4, 0, true);
            ev.setUint16(6, 0, true);
            ev.setUint16(8, files.length, true);
            ev.setUint16(10, files.length, true);
            ev.setUint32(12, centralSize, true);
            ev.setUint32(16, offset, true);
            ev.setUint16(20, 0, true);

            const zip = new Uint8Array(offset + centralSize + 22);
            let pos = 0;
            locals.forEach(part => { zip.set(part, pos); pos += part.length; });
            centrals.forEach(part => { zip.set(part, pos); pos += part.length; });
            zip.set(eocd, pos);
            return zip;
        }

        // XML 特殊字符转义
        function escapeXml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
            }[ch]));
        }

        // 生成一段文字（run）
        function docxRun(text, opts) {
            opts = opts || {};
            let rPr = '<w:rPr><w:rFonts w:ascii="微软雅黑" w:eastAsia="微软雅黑" w:hAnsi="微软雅黑"/>';
            if (opts.bold) rPr += '<w:b/><w:bCs/>';
            if (opts.color) rPr += `<w:color w:val="${opts.color}"/>`;
            if (opts.sz) rPr += `<w:sz w:val="${opts.sz}"/><w:szCs w:val="${opts.sz}"/>`;
            rPr += '</w:rPr>';
            return `<w:r>${rPr}<w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r>`;
        }

        // 生成一个单元格（默认居中、垂直居中）
        function docxCell(text, opts) {
            opts = opts || {};
            let tcPr = '<w:tcPr>';
            if (opts.fill) tcPr += `<w:shd w:val="clear" w:color="auto" w:fill="${opts.fill}"/>`;
            tcPr += '<w:vAlign w:val="center"/></w:tcPr>';
            return `<w:tc>${tcPr}<w:p><w:pPr><w:jc w:val="${opts.align || 'center'}"/></w:pPr>${docxRun(text, { bold: !!opts.bold, sz: opts.sz || 24 })}</w:p></w:tc>`;
        }

        // 生成 document.xml
        // A4 纸张：21cm x 29.7cm = 11906 x 16838 twips；页边距 2cm = 1134 twips
        function buildDocumentXml(validRows, total, dateStr) {
            const colWidths = [771, 1927, 5012, 1928]; // 内容宽 9638 twips，按 8/20/52/20% 分配
            const headers = ['序号', '配件类型', '型号', '单价(元)'];
            const border = '<w:top w:val="single" w:sz="4" w:color="DDDDDD"/><w:left w:val="single" w:sz="4" w:color="DDDDDD"/><w:bottom w:val="single" w:sz="4" w:color="DDDDDD"/><w:right w:val="single" w:sz="4" w:color="DDDDDD"/><w:insideH w:val="single" w:sz="4" w:color="DDDDDD"/><w:insideV w:val="single" w:sz="4" w:color="DDDDDD"/>';

            let rowsXml = '';
            // 表头行（行高 750 twips ≈ 50px，跨页自动重复表头）
            rowsXml += '<w:tr><w:trPr><w:trHeight w:val="750" w:hRule="atLeast"/><w:tblHeader/></w:trPr>' +
                headers.map(h => docxCell(h, { bold: true, fill: 'F1F5FD' })).join('') + '</w:tr>';
            // 数据行（行高 600 twips ≈ 40px）
            validRows.forEach((item, index) => {
                rowsXml += '<w:tr><w:trPr><w:trHeight w:val="600" w:hRule="atLeast"/></w:trPr>' +
                    docxCell(String(index + 1)) +
                    docxCell(item.type) +
                    docxCell(item.model) +
                    docxCell(parseInt(item.price).toLocaleString()) +
                    '</w:tr>';
            });
            // 合计行
            rowsXml += '<w:tr><w:trPr><w:trHeight w:val="750" w:hRule="atLeast"/></w:trPr>' +
                '<w:tc><w:tcPr><w:gridSpan w:val="3"/><w:shd w:val="clear" w:color="auto" w:fill="F8FAFD"/><w:vAlign w:val="center"/></w:tcPr>' +
                `<w:p><w:pPr><w:jc w:val="right"/></w:pPr>${docxRun('合计', { bold: true, sz: 24 })}</w:p></w:tc>` +
                docxCell(total.toLocaleString() + ' 元', { bold: true, fill: 'F8FAFD' }) +
                '</w:tr>';

            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' +
                // 标题
                '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="2C6FD1"/></w:pBdr><w:spacing w:after="300"/><w:jc w:val="center"/></w:pPr>' +
                docxRun('电脑装机配置清单', { bold: true, color: '2C6FD1', sz: 36 }) + '</w:p>' +
                // 表格
                '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:jc w:val="center"/><w:tblBorders>' + border + '</w:tblBorders>' +
                '<w:tblLayout w:type="fixed"/>' +
                '<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tblCellMar>' +
                '</w:tblPr>' +
                '<w:tblGrid>' + colWidths.map(w => `<w:gridCol w:w="${w}"/>`).join('') + '</w:tblGrid>' +
                rowsXml +
                '</w:tbl>' +
                // 页脚说明
                '<w:p><w:pPr><w:spacing w:before="400"/><w:jc w:val="right"/></w:pPr>' +
                docxRun(`生成时间: ${dateStr} | 共 ${validRows.length} 项配置`, { color: '666666', sz: 22 }) + '</w:p>' +
                // 页面设置：A4 纵向
                '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr>' +
                '</w:body></w:document>';
        }

        // 导出到Word
        function exportToWord() {
            // 过滤出有内容的行
            const validRows = configData.filter(item => item.model && item.price);
            
            if (validRows.length === 0) {
                alert('没有可导出的数据，请至少填写一行完整的型号和单价信息。');
                return;
            }
            
            // 计算总计
            const total = validRows.reduce((sum, item) => sum + parseInt(item.price), 0);
            
            // 组装 .docx（OOXML）所需的三个部件并打包为 ZIP
            const encoder = new TextEncoder();
            const zip = createZip([
                {
                    name: '[Content_Types].xml',
                    data: encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
                        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
                        '<Default Extension="xml" ContentType="application/xml"/>' +
                        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
                        '</Types>')
                },
                {
                    name: '_rels/.rels',
                    data: encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
                        '</Relationships>')
                },
                {
                    name: 'word/document.xml',
                    data: encoder.encode(buildDocumentXml(validRows, total, new Date().toLocaleString('zh-CN')))
                }
            ]);
            
            // 创建Blob对象（标准 docx MIME 类型）
            const blob = new Blob([zip], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
            
            // 创建下载链接
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `电脑装机配置清单_${new Date().toISOString().slice(0, 10)}.docx`;
            
            // 触发下载
            document.body.appendChild(a);
            a.click();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
            
            alert(`成功导出 ${validRows.length} 项配置，总计 ${total.toLocaleString()} 元`);
        }

        // 事件监听
        addRowBtn.addEventListener('click', addNewRow);
        resetBtn.addEventListener('click', resetTable);
        exportBtn.addEventListener('click', exportToWord);

        // 初始化页面
        document.addEventListener('DOMContentLoaded', initTable);
    </script>
</body>
</html>
